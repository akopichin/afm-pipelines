collaboration:
  profiles:
    dev-pipeline-default-writer-backend:
      title: ЛинусБи
      command: dev-pipeline-default-writer-backend
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-pipeline-default-writer-frontend:
      title: ЛинусФи
      command: dev-pipeline-default-writer-frontend
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-pipeline-default-writer-opus:
      title: Опусарх
      command: dev-pipeline-default-writer-opus
      delegate: false
      instructions: Implement only a bounded correction after a recorded escalation
        and ownership handoff. Read the escalation evidence and file grant before
        editing; require the accepted rescue-architect diagnosis after the repeat
        threshold, unless the user explicitly directed a different handoff. If missing,
        ask the coordinator and do not edit. Follow project rules and required checks.
        Keep evidence in the run directory.
    dev-pipeline-escalation-architect:
      title: Астра
      command: dev-pipeline-escalation-architect
      delegate: false
      instructions: Diagnose repeated failures as the standing rescue-architect. Inspect
        the full repair and review history, reproduce the failure and validate the
        smallest corrective design in scratch. Do not edit product files, delegate
        or use the managed browser. Return the diagnosis and evidence with a linked
        reply to the canonical request for the Opus writer.
    dev-pipeline-escalation-verifier:
      title: Фабула
      command: dev-pipeline-escalation-verifier
      delegate: false
      instructions: Stay idle until at least TWO post-escalation candidate rounds for
        the same logical task are rejected; the first escalation and its first
        rejection do not activate you. Then independently verify Astra's findings and corrective
        design against the frozen candidate, reproductions and adjacent paths.
        Default to read-only work; return a full linked verdict with evidence.
        Only after this repeat threshold and accepted verification may the coordinator
        grant one exceptional bounded repair of concrete remaining in-scope bugs,
        with the prior writer stopped and exclusive file/test ownership recorded.
        Follow the coordinator's diagnosis/handoff protocol and assigned review or
        writer skill. Never approve code you edited, delegate or use managed browser.
    dev-pipeline-default-coordinator-plan:
      title: ОпуПлан
      command: dev-pipeline-default-coordinator-plan
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-pipeline-default-coordinator-work:
      title: ЛинусКор
      command: dev-pipeline-default-coordinator-work
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-pipeline-default-coordinator-docs:
      title: Соня
      command: dev-pipeline-default-coordinator-docs
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-pipeline-default-verifier:
      title: Солянка · Review / verify · GPT-6.1 Sol · xhigh
      command: dev-pipeline-default-verifier
      delegate: false
      instructions: Perform the assigned bounded independent read-only review. Follow
        its scope, acceptance criteria, evidence and skill paths. Report findings
        and limitations without editing project files or delegating.
    dev-pipeline-architect:
      title: Архопус
      command: dev-pipeline-architect
      delegate: false
      instructions: Give an independent bounded read-only architecture consultation
        or root-cause diagnosis for the assigned domain. Follow the supplied skill
        paths, scope, evidence and check budget; do not edit files or delegate.
    dev-pipeline-ux:
      title: ВасЮкс
      command: dev-pipeline-ux
      delegate: false
      instructions: Give a bounded read-only UX consultation for the assigned interactions
        and acceptance criteria. Follow the supplied skill paths, references and evidence
        budget; do not edit files or delegate.
