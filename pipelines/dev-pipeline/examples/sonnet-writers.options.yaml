docker:
  agents:
    dev-pipeline-default-writer-backend:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-pipeline-default-writer-frontend:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-pipeline-default-writer-opus:
      type: claude
      model: claude-sonnet-5-5
      reasoning: xhigh
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-pipeline-default-coordinator-work:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-pipeline-default-coordinator-docs:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
