schema_version: 1
name: dev-pipeline
version: 1.3.1
description: Project-aware development with planning, standing writers, independent review, live acceptance, documentation, commit and optional merge.
entrypoint: flow.yaml
license: MIT

installation:
  project_path: pipelines/dev-pipeline
  configuration_example: config.example.yaml
  scope: project

requirements:
  python: ">=3.9"
  node: ">=18"
  git: true
  afm_features: [worktrees, team, script_stages, stage_team_skills, interactive_stages, managed_browser]
  browser_capable_coordinator: true

setup:
  configuration:
    collaboration_enabled: true
    managed_browser_enabled: true
    docker_auto_shim: true
  flow_bindings:
    skills_dir: true
    immutable_skills: true
    memory_path: true
    skill_path_token: __DEV_PIPELINE_SKILLS_DIR__
  models:
    - {role: writer_backend, title: ЛинусБи, team_member: dev-backend, profile: dev-default-writer-backend, command: dev-default-writer-backend, client: claude, model: claude-sonnet-5-5, reasoning: medium}
    - {role: writer_frontend, title: ЛинусФи, team_member: dev-frontend, profile: dev-default-writer-frontend, command: dev-default-writer-frontend, client: claude, model: claude-sonnet-5-5, reasoning: medium}
    - {role: writer_opus, title: Опусарх, previous_roles: [writer_astra], team_member: opus, previous_team_members: [astra], profile: dev-default-writer-opus, command: dev-default-writer-opus, client: claude, model: claude-opus-5-5, reasoning: xhigh}
    - {role: coordinator_plan, title: ОпуПлан, stage_ids: [plan], profile: dev-default-coordinator-plan, command: dev-default-coordinator-plan, client: claude, model: claude-opus-5-5, reasoning: xhigh}
    - {role: coordinator_work, title: ЛинусКор, stage_ids: [implement, live-run, commit, merge], profile: dev-default-coordinator-work, command: dev-default-coordinator-work, client: claude, model: claude-sonnet-5-5, reasoning: medium}
    - {role: coordinator_docs, title: Соня, stage_ids: [docs], profile: dev-default-coordinator-docs, command: dev-default-coordinator-docs, client: claude, model: claude-sonnet-5-5, reasoning: medium}
    - {role: verifier, title: Солянка, verify_stage_ids: [plan, implement, live-run, docs], profile: dev-default-verifier, command: dev-default-verifier, client: codex, model: gpt-6.1-sol, reasoning: xhigh}
    - {role: architect, title: Архопус, reuse_existing: architect, profile_token: __PROFILE_ARCHITECT__, profile: dev-architect, command: dev-architect, client: claude, model: claude-opus-5-5, reasoning: xhigh}
    - {role: ux, title: ВасЮкс, reuse_existing: ux, profile_token: __PROFILE_UX__, profile: dev-ux, command: dev-ux, client: claude, model: claude-opus-5-5, reasoning: xhigh}
  model_policy: resolved_bindings
  skills:
    - {name: afm-dev-planning, source: skills/afm-dev-planning, runtime_loading: flow_library, offer_client_installation: true}
    - {name: afm-ui-acceptance, source: skills/afm-ui-acceptance, runtime_loading: conditional, offer_client_installation: true}
    - {name: afm-check-evidence, source: skills/afm-check-evidence, runtime_loading: flow_library, offer_client_installation: true}
    - {name: afm-dev-coordinator, source: skills/afm-dev-coordinator, runtime_loading: flow_library, offer_client_installation: true}
    - {name: afm-dev-writer, source: skills/afm-dev-writer, runtime_loading: flow_library, offer_client_installation: true}
    - {name: afm-review-work, source: skills/afm-review-work, runtime_loading: explicit_package_path, offer_client_installation: true}
    - {name: afm-delivery-report, source: skills/afm-delivery-report, runtime_loading: flow_library, offer_client_installation: true}

artifacts:
  run_snapshot: bootstrap/helper.py
  planning_snapshot: bootstrap/planning
  modifies_application_source: true
  executes_changes: true

development:
  node: ">=22"
  tests: npm test
tested_with:
  afm: 2.2.2
