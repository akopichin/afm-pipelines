schema_version: 2
name: dev-pipeline
version: 2.0.3
description: Project-aware development with planning, standing writers, independent
  review, live acceptance, documentation, commit and optional merge.
entrypoint: flow.yaml
agents: agents.yaml
resources:
- package.json
- README.md
- LICENSE
- scripts
- skills
- docs
- planning
roles:
  writer_backend:
    command: dev-pipeline-default-writer-backend
    profile: dev-pipeline-default-writer-backend
  writer_frontend:
    command: dev-pipeline-default-writer-frontend
    profile: dev-pipeline-default-writer-frontend
  writer_opus:
    command: dev-pipeline-default-writer-opus
    profile: dev-pipeline-default-writer-opus
  escalation_architect:
    command: dev-pipeline-escalation-architect
    profile: dev-pipeline-escalation-architect
  escalation_verifier:
    command: dev-pipeline-escalation-verifier
    profile: dev-pipeline-escalation-verifier
  coordinator_plan:
    command: dev-pipeline-default-coordinator-plan
    profile: dev-pipeline-default-coordinator-plan
  coordinator_work:
    command: dev-pipeline-default-coordinator-work
    profile: dev-pipeline-default-coordinator-work
  coordinator_docs:
    command: dev-pipeline-default-coordinator-docs
    profile: dev-pipeline-default-coordinator-docs
  verifier:
    command: dev-pipeline-default-verifier
    profile: dev-pipeline-default-verifier
  architect:
    command: dev-pipeline-architect
    profile: dev-pipeline-architect
  ux:
    command: dev-pipeline-ux
    profile: dev-pipeline-ux
requirements:
  docker_auto_shim: true
  collaboration: true
  browser: true
  tools:
  - git
  - node
  - python3
