# Installer defaults; preserve unrelated project settings.
docker:
  autoShim: true
  agents:
    dev-default-writer-backend:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-default-writer-frontend:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-default-writer-opus:
      type: claude
      model: claude-sonnet-5-5
      reasoning: xhigh
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-default-coordinator-plan:
      type: claude
      model: claude-opus-5-5
      reasoning: xhigh
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-default-coordinator-work:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-default-coordinator-docs:
      type: claude
      model: claude-sonnet-5-5
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-default-verifier:
      type: codex
      model: gpt-6.1-sol
      reasoning: xhigh
    dev-architect:
      type: claude
      model: claude-opus-5-5
      reasoning: xhigh
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-ux:
      type: claude
      model: claude-opus-5-5
      reasoning: xhigh
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
collaboration:
  enabled: true
  profiles:
    dev-default-writer-backend:
      title: "ЛинусБи"
      command: dev-default-writer-backend
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-default-writer-frontend:
      title: "ЛинусФи"
      command: dev-default-writer-frontend
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-default-writer-opus:
      title: ЛинусХ
      command: dev-default-writer-opus
      delegate: false
      instructions: Implement only a bounded correction after a recorded escalation
        and ownership handoff. Read the escalation evidence and file grant before
        editing; if missing, ask the coordinator and do not edit. Follow project
        rules and required checks. Keep evidence in the run directory.
    dev-default-coordinator-plan:
      title: ОпуПлан
      command: dev-default-coordinator-plan
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-default-coordinator-work:
      title: ЛинусКор
      command: dev-default-coordinator-work
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-default-coordinator-docs:
      title: Соня
      command: dev-default-coordinator-docs
      delegate: false
      instructions: Follow the assigned stage or writer instructions, project rules
        and required checks. Keep evidence in the run directory.
    dev-default-verifier:
      title: Солянка · Review / verify · GPT-6.1 Sol · xhigh
      command: dev-default-verifier
      delegate: false
      instructions: Perform the assigned bounded independent read-only review.
        Follow its scope, acceptance criteria, evidence and skill paths. Report
        findings and limitations without editing project files or delegating.
    dev-architect:
      title: Архопус
      command: dev-architect
      delegate: false
      instructions: Give an independent bounded read-only architecture consultation
        or root-cause diagnosis for the assigned domain. Follow the supplied skill
        paths, scope, evidence and check budget; do not edit files or delegate.
    dev-ux:
      title: ВасЮкс
      command: dev-ux
      delegate: false
      instructions: Give a bounded read-only UX consultation for the assigned
        interactions and acceptance criteria. Follow the supplied skill paths,
        references and evidence budget; do not edit files or delegate.
