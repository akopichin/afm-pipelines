schema_version: 2
name: refactor
version: 2.0.1
description: Two-architect analysis and an interactive, user-approved refactoring
  workshop.
entrypoint: flow.yaml
agents: agents.yaml
resources:
- package.json
- README.md
- LICENSE
- scripts
- skills
- docs
- ui
- contracts
- examples
roles:
  architect_a:
    command: refactor-architect-a
    profile: refactor-architect-a
  architect_b:
    command: refactor-architect-b
    profile: refactor-architect-b
requirements:
  docker_auto_shim: true
  collaboration: true
  browser: true
  tools:
  - git
  - node
  - sh
