docker:
  agents:
    dev-spec-escalation-verifier:
      type: claude
      model: claude-fable-5-1
      reasoning: medium
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
    dev-spec-escalation-architect:
      type: codex
      model: gpt-6-astra
      reasoning: xhigh
    dev-spec-default-writer-opus:
      type: claude
      model: claude-opus-5-5
      reasoning: xhigh
      auth:
        from: env:CLAUDE_CODE_OAUTH_TOKEN
        to: env:CLAUDE_CODE_OAUTH_TOKEN
