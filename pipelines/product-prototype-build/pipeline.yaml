schema_version: 2
name: product-prototype-build
version: 0.3.1
description: "От продуктового интервью до проверенного HTML-прототипа и дизайн-системы"
entrypoint: flow.yaml
agents: agents.yaml
resources: [package.json, README.md, options.example.yaml, skills, studio, scripts]
requirements:
  docker_auto_shim: true
  browser: true
  collaboration: true
  tools: [python3]
roles:
  analyst: {command: product-prototype-build-analyst}
  designer: {command: product-prototype-build-designer}
  frontend: {command: product-prototype-build-frontend, profile: product-prototype-build-frontend}
  writer: {command: product-prototype-build-writer}
  verify: {command: product-prototype-build-verify}
  visual: {command: product-prototype-build-visual}
  polish: {command: product-prototype-build-polish, profile: product-prototype-build-polish}
