<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ревью прототипа</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.5rem;padding:.5rem;background:#eff2f5;flex-wrap:wrap}
button,input{font:inherit;padding:.4rem}button[aria-pressed=true]{background:#182c48;color:white}
main{position:relative;flex:1}iframe,svg{position:absolute;inset:0;border:0;width:100%;height:100%}
svg{touch-action:none;cursor:crosshair}svg[hidden]{display:none}input{min-width:10em;flex:1}
</style><header><button id="pen" aria-pressed="false">✎ Разметка</button>
<select id="shape" aria-label="Инструмент разметки"><option value="line">Стрелка</option><option value="ellipse">Обводка</option></select>
<input id="comment" aria-label="Комментарий" placeholder="Комментарий к стрелке или экрану">
<button id="add">Добавить</button><button id="send" disabled>Отправить</button>
<button id="approve">Утвердить версию</button><span id="status" role="status"></span></header>
<main><iframe id="app" title="Прототип" src="/index.html"></iframe><svg id="overlay" hidden>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ce2455"/></marker></defs></svg></main>
<script src="/__capture.js"></script><script src="/__review.js"></script></html>
